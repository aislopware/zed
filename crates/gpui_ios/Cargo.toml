[package]
name = "gpui_ios"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_ios.rs"
crate-type = ["staticlib", "rlib"]

[features]
default = []
runtime_shaders = ["gpui_apple/runtime_shaders"]
# `PlatformWindow::render_to_image` (offscreen Metal render of the current scene) for tests.
test-support = ["gpui/test-support", "gpui_apple/test-support"]

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
accesskit.workspace = true
anyhow.workspace = true
block2.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-text.workspace = true
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed" }
futures.workspace = true
gpui_apple.workspace = true
image.workspace = true
log.workspace = true
metal.workspace = true
objc2.workspace = true
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFCGTypes"] }
objc2-foundation.workspace = true
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "UIAccessibility",
    "UIAccessibilityConstants",
    "UIAccessibilityElement",
    "UIResponder",
    "objc2-core-foundation",
] }
parking_lot.workspace = true
pathfinder_geometry.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
uuid.workspace = true
